services:
  - type: web
    name: ved-logistics-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_INTERNAL_PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: ved-logistics-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DISABLE_DAILY_SUMMARY
        value: "true"
databases:
  - name: ved-logistics-db
    plan: free
    databaseName: vedlogistics
